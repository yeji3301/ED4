<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>영웅전설4</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="영웅전설4">
<style>
  :root {
    --bg: #000;
    --bar: #111214;
    --ink: #e9e9ea;
    --dim: #8b8c90;
    --key: #2b2c30;
    --key-hi: #3a3b40;
    --key-down: #6b6d74;
    --accent: #0a84ff;
    --pad: rgba(255,255,255,.13);
    --pad-line: rgba(255,255,255,.28);
    --pad-down: rgba(255,255,255,.38);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; }

  /* ---------- 시작 화면 ---------- */
  #home {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + var(--sat)) calc(24px + var(--sar)) calc(24px + var(--sab)) calc(24px + var(--sal));
    background: radial-gradient(120% 80% at 50% 0%, #1b1d22 0%, #000 70%);
    gap: 18px; text-align: center;
  }
  #home .logo {
    width: 84px; height: 84px; border-radius: 20px; background: linear-gradient(160deg,#2a2c33,#0d0e10);
    border: 1px solid #2f3137; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  #home .logo span { font: 700 13px/1.1 ui-monospace, Menlo, monospace; color: #9fd3ff; letter-spacing: .5px; }
  #home h1 { margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  #home p.sub { word-break: keep-all; margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; max-width: 320px; }
  .btn {
    appearance: none; border: 0; border-radius: 12px; padding: 14px 18px; min-width: 240px;
    font-size: 16px; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn.secondary { background: #1f2024; color: var(--ink); border: 1px solid #2c2d32; }
  .btn:active { filter: brightness(.85); }
  .btn[hidden] { display: none; }
  #status { min-height: 20px; color: var(--dim); font-size: 13px; }
  #status.err { color: #ff6b6b; }
  .opts { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; }
  .seg { display: inline-flex; background: #1a1b1f; border: 1px solid #2c2d32; border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; color: var(--dim); }
  .seg button.on { background: #34363c; color: var(--ink); }
  .fine { word-break: keep-all; color: #5d5f64; font-size: 11.5px; max-width: 330px; line-height: 1.5; }
  #file { display: none; }

  /* ---------- 게임 화면 ---------- */
  #game { position: fixed; inset: 0; display: none; flex-direction: column; background: #000; }
  #game.on { display: flex; }

  #toolbar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: calc(4px + var(--sat)) calc(8px + var(--sar)) 4px calc(8px + var(--sal));
    background: var(--bar); border-bottom: 1px solid #1d1e21; z-index: 20;
  }
  #toolbar .grp { display: flex; gap: 2px; }
  .tb {
    width: 42px; height: 38px; border: 0; background: transparent; border-radius: 9px;
    display: grid; place-items: center; color: var(--ink); cursor: pointer;
  }
  .tb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tb.on { color: var(--accent); background: rgba(10,132,255,.12); }
  .tb:active { background: #26272b; }
  #toast {
    position: absolute; left: 50%; top: calc(56px + var(--sat)); transform: translateX(-50%);
    background: rgba(30,31,35,.92); color: var(--ink); padding: 8px 14px; border-radius: 10px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #screenWrap { position: relative; flex: 0 0 auto; display: flex; justify-content: center; align-items: center; background: #000; }
  #screen {
    display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
  }
  #screen.smooth { image-rendering: auto; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; pointer-events: none;
  }

  /* 컨트롤 영역 (세로) */
  #controls { position: relative; flex: 1 1 auto; min-height: 0; touch-action: none; }

  /* 게임패드 */
  #pad { position: absolute; inset: 0; touch-action: none; }
  #pad[hidden], #kbd[hidden] { display: none; }
  .dpad {
    position: absolute; width: 168px; height: 168px; border-radius: 50%;
    background: var(--pad); border: 1.5px solid var(--pad-line); touch-action: none;
  }
  .dpad .arm { position: absolute; background: rgba(255,255,255,.07); }
  .dpad .arm.h { left: 18px; right: 18px; top: 50%; height: 52px; margin-top: -26px; border-radius: 12px; }
  .dpad .arm.v { top: 18px; bottom: 18px; left: 50%; width: 52px; margin-left: -26px; border-radius: 12px; }
  .dpad .tri { position: absolute; width: 0; height: 0; border: 9px solid transparent; opacity: .55; }
  .dpad .tri.u { left: 50%; top: 22px; margin-left: -9px; border-bottom-color: #fff; border-top-width: 0; }
  .dpad .tri.d { left: 50%; bottom: 22px; margin-left: -9px; border-top-color: #fff; border-bottom-width: 0; }
  .dpad .tri.l { top: 50%; left: 22px; margin-top: -9px; border-right-color: #fff; border-left-width: 0; }
  .dpad .tri.r { top: 50%; right: 22px; margin-top: -9px; border-left-color: #fff; border-right-width: 0; }
  .dpad .tri.lit { opacity: 1; filter: drop-shadow(0 0 6px #fff); }
  .abtns { position: absolute; width: 170px; height: 170px; }
  .abtn {
    position: absolute; width: 66px; height: 66px; border-radius: 50%; border: 1.5px solid var(--pad-line);
    background: var(--pad); display: grid; place-items: center; touch-action: none;
    font-weight: 700; font-size: 15px; color: rgba(255,255,255,.85);
  }
  .abtn small { display: block; font-size: 10px; font-weight: 500; color: rgba(255,255,255,.55); margin-top: 1px; }
  .abtn .in { text-align: center; line-height: 1.1; }
  body.classic .xonly, body:not(.classic) .conly { display: none !important; }
  .abtn.down, .pill.down { background: var(--pad-down); }
  .abtn.a { right: 0; top: 52px; }
  .abtn.b { right: 52px; top: 104px; }
  .abtn.x { right: 52px; top: 0; }
  .abtn.y { right: 104px; top: 52px; }
  .pills { position: absolute; display: flex; gap: 10px; left: 50%; transform: translateX(-50%); }
  .pill {
    min-width: 64px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1.5px solid var(--pad-line);
    background: var(--pad); color: rgba(255,255,255,.8); font-size: 12px; font-weight: 600;
    display: grid; place-items: center; touch-action: none;
  }

  /* 키보드 (iDOS 스타일) */
  #kbd {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal));
    background: #0e0f11; border-top: 1px solid #1f2023; display: flex; flex-direction: column; gap: 5px; touch-action: none;
  }
  .krow { display: flex; gap: 4px; }
  .k {
    flex: 1 1 0; min-width: 0; height: 38px; border-radius: 6px; border: 0; background: var(--key);
    color: var(--ink); font-size: 13px; font-weight: 500; display: grid; place-items: center;
    box-shadow: 0 1px 0 #000; touch-action: none; padding: 0; white-space: nowrap; overflow: hidden;
  }
  .k.fn { background: #202125; font-size: 11px; height: 30px; color: #c5c6ca; }
  .k.mod { background: #1d1e22; color: #c5c6ca; font-size: 12px; }
  .k.mod.latched { background: var(--accent); color: #fff; }
  .k.down { background: var(--key-down); }
  .k.w15 { flex-grow: 1.5; } .k.w2 { flex-grow: 2; } .k.w25 { flex-grow: 2.5; } .k.w5 { flex-grow: 5; }

  /* 트랙패드 표시 */
  #trackHint {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,.55);
    background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 8px; pointer-events: none; display: none;
  }
  #game.mouse #trackHint { display: block; }

  /* 설정 시트 */
  #sheet {
    position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 40; align-items: flex-end; justify-content: center;
  }
  #sheet.on { display: flex; }
  #sheet .card {
    width: 100%; max-width: 480px; background: #17181b; border-radius: 16px 16px 0 0; padding: 16px 18px calc(18px + var(--sab));
    display: flex; flex-direction: column; gap: 14px;
  }
  #sheet h3 { margin: 0; font-size: 16px; }
  #sheet .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 10px; }
  #sheet .row span { color: #c9cace; }
  #sheet .actions { display: flex; gap: 8px; }
  #sheet .actions .btn { min-width: 0; flex: 1; padding: 12px; font-size: 14px; }
  .btn.danger { background: #3a1d1f; color: #ff8a8a; border: 1px solid #522628; }

  /* 가로 모드: 화면을 최대로, 컨트롤은 반투명 오버레이 */
  /* 가로/세로는 JS가 실제 화면 크기를 재서 #game에 land 클래스로 지정 (CSS 미디어쿼리와 어긋나지 않게) */
  #game.land #toolbar {
    position: absolute; top: 0; right: 0; left: auto; border: 0; flex-direction: column; height: 100%;
    background: transparent; padding: calc(6px + var(--sat)) calc(6px + var(--sar)) calc(6px + var(--sab)) 0; justify-content: flex-start;
    pointer-events: none;
  }
  #game.land #toolbar .grp { flex-direction: column; pointer-events: auto; }
  #game.land #toolbar .grp + .grp { margin-top: auto; }
  #game.land .tb { background: rgba(20,21,25,.32); margin-bottom: 4px; opacity: .78; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  #game.land #stage { position: absolute; inset: 0; }
  #game.land #screenWrap { position: absolute; top: 0; bottom: 0; left: 0; right: 0; height: auto !important; }
  #game.land #controls { position: absolute; inset: 0; pointer-events: none; }
  #game.land #kbd { pointer-events: auto; }
  #game.land #pad { pointer-events: none; }
  #game.land #pad .dpad, #game.land #pad .abtns, #game.land #pad .pills { pointer-events: auto; opacity: .5; }
  .qpills .pill { min-width: 58px; border-color: rgba(120,170,255,.55); }
  #game.land #kbd { background: rgba(14,15,17,.72); right: calc(58px + var(--sar)); padding-right: 4px; gap: 4px; }
  #game.land .k { height: 32px; font-size: 12px; }
  #game.land .k.fn { height: 26px; }
  #game.land ~ #toast, #game.land #toast { top: calc(14px + var(--sat)); }
  /* 회전 보기: 폰을 돌리지 않아도 가로 화면으로 */
  #game.rot { inset: auto; top: 0; left: 0; transform-origin: 0 0;
    /* 90° 돌린 화면: 화면 왼쪽=폰 위(상태 표시줄), 위=폰 오른쪽, 오른쪽=폰 아래, 아래=폰 왼쪽 */
    --sal: max(env(safe-area-inset-top, 0px), 20px); --sat: env(safe-area-inset-right, 0px);
    --sar: env(safe-area-inset-bottom, 0px); --sab: env(safe-area-inset-left, 0px); }
  /* 홈 화면 앱에서 양 끝이 이미 비어 있을 때는 추가 여백 없이 */
  #game.rot.rotgap { --sal: 6px; --sar: 6px; }
  /* 전체화면(몰입) 모드: 도구 막대를 숨기고 작은 나가기 버튼만 */
  #game.imm #toolbar { display: none; }
  #immExit { display: none; position: absolute; top: calc(8px + var(--sat)); right: calc(8px + var(--sar)); z-index: 30;
    width: 38px; height: 38px; border-radius: 10px; border: 0; background: rgba(20,21,25,.35); color: #fff; opacity: .7; place-items: center; }
  #immExit svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #game.imm #immExit { display: grid; }
  #game.land #immExit { top: auto; bottom: calc(8px + var(--sab)); right: calc(8px + var(--sar)); }
  #game.rot #immExit { bottom: calc(8px + var(--sab)); right: calc(8px + var(--sar)); }
</style>
</head>
<body>

<!-- 시작 화면 -->
<section id="home">
  <img src="icon-192.png" alt="" style="width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.6)">
  <h1>영웅전설 4 · 주홍물방울</h1>
  <p class="sub">아이폰에 있는 게임 zip 파일을 불러와서 실행합니다. 게임 파일은 이 기기 안에서만 쓰이고 어디로도 전송되지 않아요.</p>
  <button class="btn" id="btnResume" hidden>이어서 시작</button>
  <button class="btn" id="btnPick">게임 zip 불러오기</button>
  <div class="opts">속도
    <div class="seg" id="segSpeed">
      <button data-v="slow">절전</button><button data-v="auto" class="on">보통</button><button data-v="fast">최대</button>
    </div>
  </div>
  <div id="status"></div>
  <p class="fine">Safari에서 공유 → '홈 화면에 추가'로 설치해 쓰세요. 세이브는 이 기기 안에 저장돼요.<br>에뮬레이터: <a href="https://js-dos.com" style="color:#7a7c82">js-dos</a> (GPL-2.0)</p>
  <input type="file" id="file" accept=".zip,application/zip,application/x-zip-compressed">
</section>

<!-- 게임 화면 -->
<section id="game">
  <div id="toolbar">
    <div class="grp">
      <button class="tb" id="tbPad" title="게임패드">
        <svg viewBox="0 0 24 24"><path d="M6.5 8h11a4 4 0 0 1 3.9 4.8l-.9 4.3a2.3 2.3 0 0 1-4 1l-1.8-2.1H9.3l-1.8 2.1a2.3 2.3 0 0 1-4-1l-.9-4.3A4 4 0 0 1 6.5 8z"/><path d="M7.5 11v3M6 12.5h3"/><circle cx="16" cy="11.5" r=".6"/><circle cx="17.8" cy="13.4" r=".6"/></svg>
      </button>
      <button class="tb" id="tbKbd" title="키보드">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M6 12.5h.01M9 12.5h.01M12 12.5h.01M15 12.5h.01M18 12.5h.01M8 15.5h8"/></svg>
      </button>
      <button class="tb" id="tbMouse" title="트랙패드 마우스">
        <svg viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="5.5"/><path d="M12 3v6"/></svg>
      </button>
    </div>
    <div class="grp">
      <button class="tb xonly" id="tbQSave" title="퀵세이브">
        <svg viewBox="0 0 24 24"><path d="M5 3.5h11l3.5 3.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5z"/><path d="M13 8l-3 5h4l-3 5"/></svg>
      </button>
      <button class="tb xonly" id="tbQLoad" title="퀵로드">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>
      </button>
      <button class="tb conly" id="tbSave" title="게임 세이브를 기기에 백업">
        <svg viewBox="0 0 24 24"><path d="M5 3.5h11l3.5 3.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5z"/><path d="M7.5 3.5v5h8v-5M7.5 20.5v-6h9v6"/></svg>
      </button>
      <button class="tb" id="tbRot" title="가로/세로 전환">
        <svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="2"/><path d="M8 3.5h5a4 4 0 0 1 4 4"/><path d="M15 5.5l2 2 2-2"/></svg>
      </button>
      <button class="tb" id="tbFull" title="메뉴 숨기기">
        <svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.9 8.4 2.5 12 2.5 12s3.5 7 9.5 7c1.8 0 3.3-.5 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
      <button class="tb" id="tbPause" title="일시정지">
        <svg viewBox="0 0 24 24" id="icoPause"><path d="M9 6v12M15 6v12"/></svg>
      </button>
      <button class="tb" id="tbMenu" title="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>

  <div id="stage">
    <div id="screenWrap">
      <canvas id="screen" width="640" height="400"></canvas>
      <div id="loading">불러오는 중…</div>
      <div id="trackHint">드래그: 이동 · 탭: 왼쪽 클릭 · 두 손가락 탭: 오른쪽 클릭</div>
    </div>
    <div id="controls">
      <div id="pad">
        <div class="dpad" id="dpad">
          <div class="arm h"></div><div class="arm v"></div>
          <div class="tri u"></div><div class="tri d"></div><div class="tri l"></div><div class="tri r"></div>
        </div>
        <div class="pills" id="pills">
          <div class="pill" data-key="258">Tab</div>
          <div class="pill" data-key="290">F1</div>
          <div class="pill" data-key="340">Shift</div>
        </div>
        <div class="pills qpills xonly" id="qpills">
          <div class="pill" data-act="qsave">퀵저장</div>
          <div class="pill" data-act="qload">퀵로드</div>
        </div>
        <div class="abtns" id="abtns">
          <div class="abtn a" data-key="257"><div class="in">A<small>Enter</small></div></div>
          <div class="abtn b" data-key="256"><div class="in">B<small>Esc</small></div></div>
          <div class="abtn x" data-key="32"><div class="in">X<small>Space</small></div></div>
          <div class="abtn y" data-key="340"><div class="in">Y<small>Shift</small></div></div>
        </div>
      </div>
      <div id="kbd" hidden></div>
    </div>
  </div>

  <div id="toast"></div>
  <button id="immExit" title="메뉴 보이기"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

        <button class="btn secondary" id="btnSaveExport">세이브 파일 내보내기</button>
        <button class="btn secondary" id="btnSaveImport">세이브 파일 가져오기</button>

<script src="emulators.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);

  // ---------- 저장소 (IndexedDB, 실패해도 동작) ----------
  const DB_NAME = "ed4-web", STORE = "kv";
  function idb() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  async function kvGet(k) {
    try { const db = await idb(); return await new Promise((res, rej) => {
      const t = db.transaction(STORE).objectStore(STORE).get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
    } catch (e) { return undefined; }
  }
  let lastKvError = "";
  async function kvSet(k, v) {
    try { const db = await idb(); return await new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(v, k);
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("abort")); });
    } catch (e) { lastKvError = (e && (e.name || e.message)) || String(e); return false; }
  }
  async function kvDel(k) {
    try { const db = await idb(); return await new Promise((res) => {
      const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    } catch (e) { return false; }
  }
  const prefs = (() => { try { return JSON.parse(localStorage.getItem("ed4-prefs") || "{}"); } catch (e) { return {}; } })();
  const useX = prefs.engine !== "classic";
  let xActive = useX;
  document.body.classList.toggle("classic", !useX);
  function savePrefs() { try { localStorage.setItem("ed4-prefs", JSON.stringify(prefs)); } catch (e) {} }
  let launchNo = 0;
  try { launchNo = (+localStorage.getItem("ed4-launch") || 0) + 1; localStorage.setItem("ed4-launch", launchNo); } catch (e) {}
  function lastSaveInfo() { try { return JSON.parse(localStorage.getItem("ed4-lastsave") || "null"); } catch (e) { return null; } }
  let rotOn = !!prefs.rot; // 가로/세로 전환(화면 90° 회전) 상태

  // ---------- 시작 화면 ----------
  const status = $("#status");
  function setStatus(msg, err) { status.textContent = msg || ""; status.classList.toggle("err", !!err); }

  function bindSeg(el, val, on) {
    el.querySelectorAll("button").forEach(b => {
      b.classList.toggle("on", b.dataset.v === val);
      b.addEventListener("click", () => {
        el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        on(b.dataset.v);
      });
    });
  }
  bindSeg($("#segSpeed"), prefs.speed || "auto", v => { prefs.speed = v; savePrefs(); });
  bindSeg($("#segSpeed2"), prefs.speed || "auto", v => { prefs.speed = v; savePrefs(); toast("게임을 다시 열면 적용돼요", 2000); });
  bindSeg($("#segEngine"), useX ? "x" : "classic", v => { prefs.engine = v; savePrefs(); toast("게임을 다시 열면 적용돼요", 2000); });

  // 보관된 zip이 있으면 바로 실행 (설정에서 '다른 zip 불러오기'를 누른 경우만 시작 화면 표시)
  // ---- zip을 16MB 조각으로 나눠 브라우저 저장소에 보관 (큰 파일 한 덩어리 저장이 실패하는 iOS 대응)
  const CHUNK = 16 * 1024 * 1024;
  async function dropStoredZip() {
    const m = await kvGet("zipmeta");
    if (m && m.count) for (let i = 0; i < m.count; i++) await kvDel("zipc:" + i);
    await kvDel("zipmeta"); await kvDel("zip"); await kvDel("game");
  }
  async function storeZipChunks(f) {
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
    const count = Math.ceil(f.size / CHUNK);
    for (let i = 0; i < count; i++) {
      const buf = await f.slice(i * CHUNK, Math.min(f.size, (i + 1) * CHUNK)).arrayBuffer();
      if (!(await kvSet("zipc:" + i, buf))) {
        for (let j = 0; j <= i; j++) await kvDel("zipc:" + j);
        return false;
      }
    }
    if (!(await kvSet("zipmeta", { name: f.name, size: f.size, chunk: CHUNK, count }))) return false;
    // 제대로 들어갔는지 마지막 조각을 읽어 확인
    const last = await kvGet("zipc:" + (count - 1));
    return !!(last && last.byteLength === f.size - (count - 1) * CHUNK);
  }
  // 저장된 조각을 파일처럼 읽게 해 주는 객체 (필요한 조각만 꺼내 씀 → 메모리 절약)
  function chunkSource(meta) {
    const cache = new Map();
    async function getChunk(i) {
      if (cache.has(i)) return cache.get(i);
      const ab = await kvGet("zipc:" + i);
      if (!ab) throw new Error("저장된 조각 " + i + "을 찾지 못했어요");
      const u = new Uint8Array(ab); cache.set(i, u);
      if (cache.size > 2) cache.delete(cache.keys().next().value);
      return u;
    }
    return { size: meta.size, name: meta.name, slice(a, b) { return { arrayBuffer: async () => {
      const out = new Uint8Array(b - a); let pos = a;
      while (pos < b) {
        const ci = Math.floor(pos / meta.chunk), c = await getChunk(ci), off = pos - ci * meta.chunk;
        const n = Math.min(c.length - off, b - pos);
        out.set(c.subarray(off, off + n), pos - a); pos += n;
      }
      return out.buffer;
    } }; } };
  }
  async function storageInfo() {
    try { const e = await navigator.storage.estimate(); return "사용 가능 약 " + Math.round((e.quota - e.usage) / MB) + "MB"; } catch (e) { return ""; }
  }
  async function startFromStored(z) {
    $("#home").style.display = "none"; $("#game").classList.add("on"); applyLayout();
    $("#loading").style.display = "grid"; $("#loading").textContent = "저장된 게임 여는 중…";
    try {
      const game = await readGameFilesFromFile(z.blob, (d, t) => {
        $("#loading").textContent = "게임 파일 푸는 중… " + Math.round(d / MB) + " / " + Math.round(t / MB) + "MB";
      });
      start(game);
    } catch (err) {
      $("#game").classList.remove("on"); $("#home").style.display = "";
      setStatus("저장된 게임을 열지 못했어요: " + err.message + " — zip을 다시 불러와 주세요.", true);
    }
  }
  (async () => {
    let noAuto = false;
    try { noAuto = sessionStorage.getItem("ed4-noauto") === "1"; sessionStorage.removeItem("ed4-noauto"); } catch (e) {}
    const meta = await kvGet("zipmeta");
    const z = meta && meta.count ? { name: meta.name, blob: chunkSource(meta) } : await kvGet("zip");
    if (z && z.blob && !noAuto) { startFromStored(z); return; }
    const g = z && z.blob ? z : await kvGet("game");
    if (!g) {
      const info = await storageInfo(), ls = lastSaveInfo();
      let msg = "실행 기록 " + (launchNo || "?") + "번째";
      if (ls) msg += " · 지난 보관 시도: " + (ls.ok ? "성공" : "실패" + (ls.err ? "(" + ls.err + ")" : "")) + " " + new Date(ls.at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      else msg += " · 지난 보관 기록 없음";
      if (info) msg += " · " + info;
      setStatus(msg);
    }
    if (g && (g.blob || g.bytes || g.files)) {
      $("#btnResume").hidden = false;
      $("#btnPick").textContent = "다른 zip 불러오기";
      $("#btnPick").classList.add("secondary");
      setStatus("저장된 게임: " + (g.name || "game.zip"));
    }
  })();
  // iOS는 터치(손을 뗄 때)가 있어야 소리를 켤 수 있고, 앱을 내렸다 올리면 소리가 다시 멈춤
  // → 소리가 꺼져 있으면 터치할 때마다 다시 켬. 무음 모드(벨소리 끔)에서는 게임 소리도 끔
  function ensureAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "ambient") navigator.audioSession.type = "ambient"; } catch (e) {}
    if (!actx) { primeAudio(); return; }
    if (actx.state !== "running") {
      try {
        actx.resume && actx.resume();
        const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
        s.buffer = b; s.connect(actx.destination); s.start(0);
      } catch (e) {}
    }
  }
  ["touchend", "pointerup", "click", "keydown"].forEach(t => document.addEventListener(t, ensureAudio, { capture: true, passive: true }));
  window.__audioState = () => actx ? actx.state : "none";

  $("#btnPick").addEventListener("click", () => { primeAudio(); $("#file").click(); });

  // zip 파일 전체를 메모리에 올리지 않고, 목차와 게임 폴더 부분만 골라 읽어 새 zip을 만듦
  async function readSlice(file, from, to) { return new Uint8Array(await file.slice(from, to).arrayBuffer()); }
  // zip에서 게임 폴더 파일만 꺼내 압축을 풀어 [{path, contents}]로 반환 (에뮬레이터가 zip을 또 풀지 않게)
  async function inflateRaw(data) {
    const ds = new DecompressionStream("deflate-raw");
    return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());
  }
  async function readGameFilesFromFile(file, onProg) {
    const size = file.size, tail = await readSlice(file, Math.max(0, size - 65557), size), tdv = new DataView(tail.buffer);
    let e = -1;
    for (let i = tail.length - 22; i >= 0; i--) if (tdv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error("zip 목차를 찾지 못했어요");
    const count = tdv.getUint16(e + 10, true), cdSize = tdv.getUint32(e + 12, true), cdOff = tdv.getUint32(e + 16, true);
    const cd = await readSlice(file, cdOff, cdOff + cdSize), dv = new DataView(cd.buffer);
    const fake = new Uint8Array(cd.length + 22); fake.set(cd);
    const fdv = new DataView(fake.buffer);
    fdv.setUint32(cd.length, 0x06054b50, true); fdv.setUint16(cd.length + 10, count, true);
    const names = zipEntries(fake).map(x => x.replace(/\\/g, "/"));
    const layout = findLayout(fake);
    if (!layout) throw new Error("zip 안에서 GAME.BAT를 찾지 못했어요");
    const cdrom = layout.length >= 2 && layout[layout.length - 2].toUpperCase() === "GAME";
    const keepDir = cdrom ? layout.slice(0, -1) : layout;
    const prefix = keepDir.length ? keepDir.join("/") + "/" : "";
    const ents = []; let off = 0, total = 0;
    for (let n = 0; n < count; n++) {
      const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
      const name = names[n];
      if (name.startsWith(prefix) && !name.endsWith("/") && !name.split("/").includes("__MACOSX")) {
        const ent = { name, crc: dv.getUint32(off + 16, true), method: dv.getUint16(off + 10, true), csize: dv.getUint32(off + 20, true),
          usize: dv.getUint32(off + 24, true), loc: dv.getUint32(off + 42, true) };
        ents.push(ent); total += ent.usize;
      }
      off += 46 + nl + el + cl;
    }
    const files = []; let done = 0;
    for (const ent of ents) {
      const h = await readSlice(file, ent.loc, ent.loc + 30), hdv = new DataView(h.buffer);
      const start = ent.loc + 30 + hdv.getUint16(26, true) + hdv.getUint16(28, true);
      const raw = await readSlice(file, start, start + ent.csize);
      let contents;
      if (ent.method === 0) contents = raw;
      else if (ent.method === 8) contents = await inflateRaw(raw);
      else throw new Error("지원하지 않는 압축 방식이에요 (" + ent.name + ")");
      if (contents.length !== ent.usize) throw new Error("압축 해제 크기가 맞지 않아요 (" + ent.name + ")");
      files.push({ path: ent.name, contents, crc: ent.crc });
      done += ent.usize; if (onProg) onProg(done, total);
    }
    return { files, layout, size: done };
  }
  const MB = 1024 * 1024, STORE_LIMIT = 150 * MB;

  $("#file").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setStatus("zip 목차 읽는 중… (" + Math.round(f.size / MB) + "MB)");
    try {
      const head = await readSlice(f, 0, 4);
      if (head[0] !== 0x50 || head[1] !== 0x4b) throw new Error("zip 파일이 아니에요");
      if (typeof DecompressionStream === "undefined") throw new Error("이 브라우저는 압축 해제를 지원하지 않아요. iOS를 최신으로 업데이트해 주세요.");
      const game = await readGameFilesFromFile(f, (d, t) => setStatus("게임 파일 푸는 중… " + Math.round(d / MB) + " / " + Math.round(t / MB) + "MB"));
      const prev = (await kvGet("zipmeta")) || (await kvGet("zip"));
      const same = prev && prev.name === f.name && prev.size === f.size;
      if (!same) { await kvDel("changes"); await kvDel("saves"); }
      start(game);
      // 게임이 도는 동안 뒤에서 zip을 조각으로 보관 → 다음부터 파일 선택 없이 바로 시작
      (async () => {
        await dropStoredZip();
        const ok = await storeZipChunks(f);
        try { localStorage.setItem("ed4-lastsave", JSON.stringify({ ok, at: Date.now(), err: ok ? "" : lastKvError, size: f.size })); } catch (e) {}
        if (ok) toast("게임 파일을 이 기기에 보관했어요. 다음부터는 바로 시작돼요", 3500);
        else toast("게임 파일을 보관하지 못했어요 (" + ((await storageInfo()) || "저장 공간 한도") + "). 다음에도 zip을 골라 주세요", 6000);
      })();
    } catch (err) { setStatus("불러오기 실패: " + err.message, true); }
  });
  let sessionNote = "";
  $("#btnResume").addEventListener("click", async () => {
    primeAudio();
    const meta = await kvGet("zipmeta");
    const z = meta && meta.count ? { name: meta.name, blob: chunkSource(meta) } : await kvGet("zip");
    if (z && z.blob) { startFromStored(z); return; }
    const g = await kvGet("game");
    if (!g) { setStatus("저장된 게임을 찾지 못했어요. zip을 다시 불러와 주세요.", true); return; }
    start(g.files ? { files: g.files, layout: g.layout, size: g.size } : g.bytes);
  });

  // ---------- 오디오 ----------
  let actx = null, proc = null, gain = null;
  let ring = new Float32Array(1 << 16), rHead = 0, rTail = 0, rFrac = 0, srcRate = 22050, starving = true;
  // 에뮬레이터가 쉬었다 몰아서 소리를 보내도 끊기지 않게 약간의 여유분(약 0.09초)을 두고 재생
  const AUD_TARGET = 0.09;
  const audStat = window.__audStat = { under: 0, trim: 0 };
  let soundOn = prefs.sound !== "off";
  function primeAudio() {
    if (actx) { actx.resume && actx.resume(); return; }
    try {
      try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) {}
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      gain = actx.createGain(); gain.gain.value = soundOn ? 1 : 0; gain.connect(actx.destination);
      proc = actx.createScriptProcessor(1024, 0, 1);
      proc.onaudioprocess = (ev) => {
        const out = ev.outputBuffer.getChannelData(0);
        const N = ring.length, mask = N - 1, target = srcRate * AUD_TARGET;
        let avail = (rTail - rHead + N) & mask;
        // 비었으면 여유분이 다시 찰 때까지 기다렸다가 재생 (조각조각 끊기는 소리 방지)
        if (starving && avail < target) { out.fill(0); return; }
        starving = false;
        // 쌓인 양에 따라 재생 속도를 아주 살짝(최대 ±2.5%) 조절해 버리는 소리 없이 지연을 맞춤
        const adj = Math.max(-0.025, Math.min(0.025, (avail - target) / target * 0.025));
        const step = srcRate / actx.sampleRate * (1 + adj);
        for (let i = 0; i < out.length; i++) {
          if (avail < 2) { out[i] = 0; if (!starving) { starving = true; audStat.under++; } continue; }
          const a = ring[rHead], b = ring[(rHead + 1) & mask];
          out[i] = a + (b - a) * rFrac;
          rFrac += step;
          while (rFrac >= 1) { rFrac -= 1; rHead = (rHead + 1) & mask; avail--; }
        }
      };
      proc.connect(gain);
      // iOS: 무음 버퍼 한 번 재생해서 오디오 잠금 해제
      const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
      s.buffer = b; s.connect(actx.destination); s.start(0);
      actx.resume && actx.resume();
    } catch (e) { actx = null; }
  }
  function pushSound(samples) {
    if (!actx) return;
    const N = ring.length, mask = N - 1;
    let avail = (rTail - rHead + N) & mask;
    // 너무 많이 밀렸을 때만(0.35초 이상) 정리. 평소에는 재생 속도 조절로 따라잡음
    const maxLag = Math.floor(srcRate * 0.35), keep = Math.floor(srcRate * AUD_TARGET);
    if (avail + samples.length > maxLag) { audStat.trim++; rHead = (rTail - Math.min(avail, keep) + N) & mask; avail = Math.min(avail, keep); }
    window.__audioLagMs = Math.round((avail + samples.length) / srcRate * 1000);
    for (let i = 0; i < samples.length; i++) { ring[rTail] = samples[i]; rTail = (rTail + 1) & mask; }
  }
  function setSound(on) { soundOn = on; prefs.sound = on ? "on" : "off"; savePrefs(); if (gain) gain.gain.value = on ? 1 : 0; }

  // ---------- 에뮬레이터 ----------
  let ci = null, paused = false, persistTimer = null, saving = false;
  const canvas = $("#screen"), ctx2d = canvas.getContext("2d");
  let img = null, pendingRgb = null, pendingRgba = null;

  // zip 목차(중앙 디렉터리)만 읽어서 GAME.BAT가 있는 폴더를 찾음 — 압축은 풀지 않음
  function zipEntries(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 65535); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return [];
    const count = dv.getUint16(eocd + 10, true);

  };
  for (let i = 1; i <= 12; i++) CODE["F" + i] = 289 + i;
  for (let i = 0; i <= 9; i++) { CODE["Digit" + i] = 48 + i; CODE["Numpad" + i] = 320 + i; }
  for (let c = 65; c <= 90; c++) CODE["Key" + String.fromCharCode(c)] = c;
  window.addEventListener("keydown", (e) => {
    if (!ci) return; const c = CODE[e.code]; if (c === undefined) return;
    e.preventDefault(); if (!e.repeat) ci.sendKeyEvent(c, true);
  });
  window.addEventListener("keyup", (e) => {
    if (!ci) return; const c = CODE[e.code]; if (c === undefined) return;
    e.preventDefault(); ci.sendKeyEvent(c, false);
  });

  // 누르는 버튼 공통 처리 (멀티터치)
  function bindPress(el, code) {
    const ids = new Set();
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (ids.size === 0) { el.classList.add("down"); keyDown(code); }
      ids.add(e.pointerId);
    });
    const up = (e) => {
      if (!ids.has(e.pointerId)) return; ids.delete(e.pointerId);
      if (ids.size === 0) { el.classList.remove("down"); keyUp(code); }
    };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("lostpointercapture", up);
  }
  document.querySelectorAll("[data-key]").forEach(el => { if (!el.classList.contains("k")) bindPress(el, +el.dataset.key); });

  // 방향 패드 (8방향)
  (() => {
    const dp = $("#dpad");
    const tri = { 265: dp.querySelector(".u"), 264: dp.querySelector(".d"), 263: dp.querySelector(".l"), 262: dp.querySelector(".r") };
    let pid = null, cur = new Set();
    function set(next) {
      for (const c of cur) if (!next.has(c)) { keyUp(c); tri[c].classList.remove("lit"); }
      for (const c of next) if (!cur.has(c)) { keyDown(c); tri[c].classList.add("lit"); }
      cur = next;
    }
    function fromEvent(e) {
      const r = dp.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (rotOn) { const t = dx; dx = dy; dy = -t; } // 90° 돌린 화면 기준 방향으로
      const dist = Math.hypot(dx, dy), s = new Set();
      if (dist < r.width * 0.12) return s;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI; // -180..180, 0 = 오른쪽
      const sector = Math.round(ang / 45); // -4..4
      const map = { 0: [262], 1: [262, 264], 2: [264], 3: [264, 263], 4: [263], "-4": [263], "-3": [263, 265], "-2": [265], "-1": [265, 262] };
      (map[sector] || []).forEach(c => s.add(c));
      return s;
    }
    dp.addEventListener("pointerdown", (e) => {
      e.preventDefault(); if (pid !== null) return; pid = e.pointerId;
      try { dp.setPointerCapture(pid); } catch (_) {}
      set(fromEvent(e));
    });
    dp.addEventListener("pointermove", (e) => { if (e.pointerId === pid) set(fromEvent(e)); });
    const end = (e) => { if (e.pointerId !== pid) return; pid = null; set(new Set()); };
    dp.addEventListener("pointerup", end); dp.addEventListener("pointercancel", end); dp.addEventListener("lostpointercapture", end);
  })();

  // ---------- iDOS 스타일 키보드 ----------
  const KB = [
    [["Esc",256,"fn"],["F1",290,"fn"],["F2",291,"fn"],["F3",292,"fn"],["F4",293,"fn"],["F5",294,"fn"],["F6",295,"fn"],["F7",296,"fn"],["F8",297,"fn"],["F9",298,"fn"],["F10",299,"fn"]],
    [["1",49],["2",50],["3",51],["4",52],["5",53],["6",54],["7",55],["8",56],["9",57],["0",48],["⌫",259,"mod"]],
    [["Tab",258,"mod w15"],["Q",81],["W",87],["E",69],["R",82],["T",84],["Y",89],["U",85],["I",73],["O",79],["P",80]],
    [["A",65],["S",83],["D",68],["F",70],["G",71],["H",72],["J",74],["K",75],["L",76],["Enter",257,"mod w2"]],
    [["Shift",340,"mod w15 latch"],["Z",90],["X",88],["C",67],["V",86],["B",66],["N",78],["M",77],["-",45],["↑",265,"mod"],["/",47]],
    [["Ctrl",341,"mod w15 latch"],["Alt",342,"mod w15 latch"],["Space",32,"w5"],["←",263,"mod"],["↓",264,"mod"],["→",262,"mod"]],
  ];
  (() => {
    const kbd = $("#kbd"), latched = new Map();
    for (const row of KB) {
      const r = document.createElement("div"); r.className = "krow";
      for (const [label, code, cls] of row) {
        const b = document.createElement("div");
        b.className = "k " + (cls || ""); b.textContent = label;
        r.appendChild(b);
        if ((cls || "").includes("latch")) {
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            if (latched.has(code)) { latched.delete(code); b.classList.remove("latched"); keyUp(code); }
            else { latched.set(code, b); b.classList.add("latched"); keyDown(code); }
          });
        } else {
          bindPress(b, code);
          // 일반 키를 떼면 걸려 있던 Shift/Ctrl/Alt 해제
          b.addEventListener("pointerup", () => {
            for (const [c, el] of latched) { keyUp(c); el.classList.remove("latched"); }
            latched.clear();
          });
        }
      }
      kbd.appendChild(r);
    }
  })();

  // ---------- 트랙패드 마우스 ----------
  let mouseMode = false;
  (() => {
    const pts = new Map(); let moved = false, downAt = 0, maxPts = 0;
    canvas.addEventListener("pointerdown", (e) => {
      if (!mouseMode || !ci) return; e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (pts.size === 0) { moved = false; downAt = performance.now(); maxPts = 0; }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); maxPts = Math.max(maxPts, pts.size);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!mouseMode || !ci || !pts.has(e.pointerId)) return;
      const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      p.x = e.clientX; p.y = e.clientY;
      if (pts.size === 1) {
        const k = canvas.width / (canvas.offsetWidth || canvas.width) * 1.4;
        const mx = rotOn ? dy : dx, my = rotOn ? -dx : dy;
        ci.sendMouseRelativeMotion(mx * k, my * k);
      }
    });
    const end = (e) => {
      if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
      if (pts.size === 0 && mouseMode && ci && !moved && performance.now() - downAt < 300) {
        const btn = maxPts >= 2 ? 1 : 0;
        ci.sendMouseButton(btn, true); setTimeout(() => ci && ci.sendMouseButton(btn, false), 60);
      }
    };
    canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
  })();

  // ---------- 툴바 / 설정 ----------
  let view = prefs.view || "pad"; // pad | kbd | none
  function setView(v) {
    view = v; prefs.view = v; savePrefs(); releaseAll();
    $("#pad").hidden = v !== "pad"; $("#kbd").hidden = v !== "kbd";
    $("#tbPad").classList.toggle("on", v === "pad"); $("#tbKbd").classList.toggle("on", v === "kbd");
    applyLayout();
  }
  $("#tbPad").addEventListener("click", () => setView(view === "pad" ? "none" : "pad"));
  $("#tbKbd").addEventListener("click", () => setView(view === "kbd" ? "none" : "kbd"));
  $("#tbMouse").addEventListener("click", () => {
    mouseMode = !mouseMode; $("#tbMouse").classList.toggle("on", mouseMode); $("#game").classList.toggle("mouse", mouseMode);
    toast(mouseMode ? "트랙패드 모드 켜짐" : "트랙패드 모드 꺼짐", 1100);
  });
  $("#tbSave").addEventListener("click", () => backupSave(true));
  // 가로/세로 전환: 폰 화면 회전 잠금과 상관없이 게임 화면만 90° 돌려 보여줌
  function setRot(on) {
    rotOn = on; prefs.rot = on; savePrefs(); releaseAll();
    $("#tbRot").classList.toggle("on", on);
    relayout();
  }
  $("#tbRot").classList.toggle("on", rotOn);
  $("#tbRot").addEventListener("click", () => { setRot(!rotOn); toast(rotOn ? "가로 화면으로 돌렸어요" : "원래 방향으로 돌아왔어요", 1200); });
  // 전체화면: 지원되면 진짜 전체화면, 안 되면(아이폰) 도구 막대를 숨기는 몰입 모드
  // 메뉴(도구 막대) 숨기기: ≡ 버튼 하나만 남기고 숨김, 다음 실행에도 그대로 유지
  function setImm(on) { $("#game").classList.toggle("imm", on); prefs.menuHidden = on; savePrefs(); relayout(); }
  $("#tbFull").addEventListener("click", () => { setImm(true); toast("메뉴를 숨겼어요 · ≡ 버튼으로 다시 보기", 1600); });
  $("#immExit").addEventListener("click", () => setImm(false));
  if (prefs.menuHidden) $("#game").classList.add("imm");
  $("#tbPause").addEventListener("click", () => {
    if (!ci) return; paused = !paused;
    paused ? ci.pause() : ci.resume();
    $("#icoPause").innerHTML = paused ? '<path d="M8 5.5v13l10-6.5z"/>' : '<path d="M9 6v12M15 6v12"/>';
    $("#tbPause").classList.toggle("on", paused);
    toast(paused ? "일시정지" : "계속", 900);
  });
  $("#tbMenu").addEventListener("click", () => $("#sheet").classList.add("on"));
  $("#btnClose").addEventListener("click", () => $("#sheet").classList.remove("on"));
  $("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").classList.remove("on"); });
  $("#btnOther").addEventListener("click", async () => {
    $("#btnOther").textContent = "세이브 백업 중…";
    await backupSave(false);
    try { sessionStorage.setItem("ed4-noauto", "1"); } catch (e) {}
    location.reload();
  });
  $("#btnQuit").addEventListener("click", async () => {
    $("#btnQuit").textContent = "백업 중…";
    await backupSave(false);
    try { clearInterval(persistTimer); await ci.exit(); } catch (e) {}
    try { sessionStorage.setItem("ed4-noauto", "1"); } catch (e) {}
    location.reload();
  });
  bindSeg($("#segSmooth"), prefs.smooth || "sharp", v => { prefs.smooth = v; savePrefs(); canvas.classList.toggle("smooth", v === "smooth"); });
  canvas.classList.toggle("smooth", prefs.smooth === "smooth");
  bindSeg($("#segSound"), soundOn ? "on" : "off", v => { primeAudio(); setSound(v === "on"); });
  bindSeg($("#segFit"), prefs.fit === "43" ? "43" : "fill", v => { prefs.fit = v; savePrefs(); relayout(); });
  bindSeg($("#segPadSize"), prefs.padSize || "m", v => { prefs.padSize = v; savePrefs(); applyLayout(); });

  let toastT = 0;
  function toast(msg, ms) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms || 1500);
  }

  // ---------- 레이아웃 ----------
  // 실제 #game 크기를 기준으로 계산 (회전 직후 innerWidth/innerHeight가 늦게 바뀌는 iOS 대응)
  const gameEl = $("#game");
  function placeRot() {
    if (rotOn) {
      const vw = window.visualViewport ? Math.round(visualViewport.width) : innerWidth;
      const vh = window.visualViewport ? Math.round(visualViewport.height) : innerHeight;
      // 홈 화면 앱(iOS)은 화면 아래쪽 일부(상태표시줄 높이만큼)를 그리지 못하는 경우가 있음.
      // 그 빈 띠만큼 반대쪽(상태표시줄 쪽)도 비워서 화면이 가운데 오도록 맞춤
      const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
      const longSide = Math.max(screen.width || 0, screen.height || 0);
      let gap = standalone && innerWidth < innerHeight ? longSide - vh : 0;
      if (!(gap > 8 && gap < 120)) gap = 0;
      gameEl.classList.add("rot");
      gameEl.style.width = (vh - gap) + "px"; gameEl.style.height = vw + "px";
      gameEl.style.transform = "translate(" + vw + "px, " + gap + "px) rotate(90deg)";
      gameEl.classList.toggle("rotgap", gap > 0);
    } else {
      gameEl.classList.remove("rot", "rotgap");
      gameEl.style.width = gameEl.style.height = gameEl.style.transform = "";
    }
  }
  function applyLayout() {
    placeRot();
    const W = gameEl.offsetWidth || innerWidth, H = gameEl.offsetHeight || innerHeight;
    if (!W || !H) return;
    const landscape = W > H;
    gameEl.classList.toggle("land", landscape);
    const wrap = $("#screenWrap");
    const fill = landscape ? prefs.fit !== "43" : prefs.fit === "fill"; // 가로는 기본으로 꽉 채움
    const ar = 4 / 3; // DOS 모니터 비율 (640x400도 4:3로 늘려서 원래 모습 재현)
    const scale = { s: 0.8, m: 1, l: 1.2 }[prefs.padSize || "m"];
    let w, h;
    if (landscape) {
      wrap.style.height = "";
      const aw = wrap.offsetWidth || W, ah = wrap.offsetHeight || H;
      if (fill) { w = aw; h = ah; }
      else { w = Math.min(aw, ah * ar); h = w / ar; }
    } else {
      const tb = gameEl.classList.contains("imm") ? 0 : ($("#toolbar").offsetHeight || 46);
      w = W; h = w / ar;
      const maxH = H - tb - 230; // 아래 컨트롤 자리 최소 230px 확보
      if (fill && maxH > h) h = Math.min(maxH, W * 0.9);
      wrap.style.height = Math.floor(h) + "px";
    }
    canvas.style.width = Math.floor(w) + "px"; canvas.style.height = Math.floor(h) + "px";

    const dp = $("#dpad"), ab = $("#abtns"), pills = $("#pills"), qp = $("#qpills");
    dp.style.transform = ab.style.transform = "scale(" + scale + ")";
    if (landscape) {
      dp.style.transformOrigin = "left bottom"; ab.style.transformOrigin = "right bottom";
      // 패드를 가장자리에서 안쪽으로 당겨 엄지가 닿기 편한 위치로
      const inX = Math.round(40 + Math.max(0, W - 700) * 0.25), inY = Math.round(Math.max(22, H * 0.12));
      const tbW = gameEl.classList.contains("imm") ? 0 : 48;
      // 양쪽 여백을 같게 해서 좌우 균형을 맞춤
      const side = "max(var(--sal), var(--sar))";
      dp.style.left = "calc(" + inX + "px + " + side + ")"; dp.style.top = ""; dp.style.bottom = "calc(" + inY + "px + var(--sab))";
      ab.style.right = "calc(" + (inX + tbW) + "px + " + side + ")"; ab.style.top = ""; ab.style.bottom = "calc(" + (inY - 4) + "px + var(--sab))";
      pills.style.top = ""; pills.style.bottom = "calc(10px + var(--sab))";
      // 퀵저장/퀵로드는 실수로 누르지 않게 화면 위쪽 가운데로 따로 뺌
      qp.style.bottom = ""; qp.style.top = "calc(8px + var(--sat))";
    } else {
      const cy = Math.max(110, ($("#controls").offsetHeight || 300) * 0.5);
      dp.style.transformOrigin = "left center"; ab.style.transformOrigin = "right center";
      dp.style.left = "calc(20px + var(--sal))"; dp.style.bottom = ""; dp.style.top = (cy - 84) + "px";
      ab.style.right = "calc(18px + var(--sar))"; ab.style.bottom = ""; ab.style.top = (cy - 85) + "px";
      pills.style.bottom = ""; pills.style.top = "14px";
      qp.style.top = ""; qp.style.bottom = "calc(12px + var(--sab))";
    }
  }
  // 회전·주소창 변화·앱 안 웹뷰 크기 변화를 모두 잡도록 여러 신호에 연결
  let relayT = [];
  function relayout() {
    applyLayout();
    relayT.forEach(clearTimeout);
    relayT = [60, 200, 450, 900].map(ms => setTimeout(applyLayout, ms));
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", relayout);
  if (window.visualViewport) visualViewport.addEventListener("resize", relayout);
  try { matchMedia("(orientation: landscape)").addEventListener("change", relayout); } catch (e) {}
  try { new ResizeObserver(() => applyLayout()).observe(gameEl); } catch (e) {}
  setView(view);

  // 페이지 확대/스크롤 방지
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => { if ($("#game").classList.contains("on")) e.preventDefault(); }, { passive: false });
})();
</script>
<script>
  if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
</html>
